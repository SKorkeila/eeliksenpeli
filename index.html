<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eeliksen peli</title>
  <style>
    /* Sivun ulkoasu: tumma tausta ja peli keskellä */
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    /* Pelialue (canvas = "piirustuspaperi", jolle peli piirretään) */
    canvas {
      background: #87ceeb; /* taivaansininen */
      border: 4px solid white;
      max-width: 100%;
    }
    p { opacity: 0.7; }
  </style>
</head>
<body>
  <h1>Eeliksen peli</h1>
  <canvas id="peli" width="800" height="300"></canvas>
  <p>Hyppää: välilyönti, nuoli ylös tai klikkaa / napauta</p>

  <script>
    // ============================================
    //  SÄÄDETTÄVÄT ARVOT – kokeile muuttaa näitä!
    // ============================================
    const GRAVITY = 0.6;         // Painovoima: kuinka nopeasti hahmo putoaa alas
    const JUMP_POWER = 12;       // Hypyn voima: kuinka korkealle hahmo hyppää
    const PLAYER_SIZE = 40;      // Hahmon koko pikseleinä
    const PLAYER_COLOR = "#ff4757"; // Hahmon väri
    const GROUND_HEIGHT = 50;    // Maan paksuus ruudun alareunassa
    const GROUND_COLOR = "#2ed573"; // Maan väri

    // ============================================
    //  Pelin valmistelu
    // ============================================
    const canvas = document.getElementById("peli");
    const ctx = canvas.getContext("2d"); // ctx on "kynä", jolla piirretään

    // Maan yläreunan korkeus (y-koordinaatti). Huom: canvasissa y kasvaa ALASPÄIN!
    const groundY = canvas.height - GROUND_HEIGHT;

    // Hahmo on olio, jolla on sijainti (x, y) ja pystynopeus (vy)
    const player = {
      x: 80,
      y: groundY - PLAYER_SIZE, // seisoo maan päällä
      vy: 0,                    // pystysuuntainen nopeus (negatiivinen = ylöspäin)
      onGround: true            // onko hahmo maassa?
    };

    // ============================================
    //  Hyppääminen
    // ============================================
    function jump() {
      // Hypätä saa vain maasta, ettei voi lentää ilmassa loputtomasti
      if (player.onGround) {
        player.vy = -JUMP_POWER; // miinus = ylöspäin
        player.onGround = false;
      }
    }

    // Näppäimistö: välilyönti tai nuoli ylös
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault(); // estää sivua vierimästä välilyönnillä
        jump();
      }
    });

    // Hiiri ja kosketusnäyttö
    canvas.addEventListener("pointerdown", jump);

    // ============================================
    //  Päivitys: liikutetaan asioita joka ruudunpäivityksellä
    // ============================================
    function update() {
      // Painovoima kasvattaa putoamisnopeutta koko ajan
      player.vy += GRAVITY;
      // Nopeus siirtää hahmoa
      player.y += player.vy;

      // Jos hahmo menisi maan sisään, pysäytetään se maan pinnalle
      if (player.y >= groundY - PLAYER_SIZE) {
        player.y = groundY - PLAYER_SIZE;
        player.vy = 0;
        player.onGround = true;
      }
    }

    // ============================================
    //  Piirtäminen
    // ============================================
    function draw() {
      // Tyhjennetään koko ruutu ennen uutta piirtoa
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Maa
      ctx.fillStyle = GROUND_COLOR;
      ctx.fillRect(0, groundY, canvas.width, GROUND_HEIGHT);

      // Hahmo (toistaiseksi neliö)
      ctx.fillStyle = PLAYER_COLOR;
      ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);

      // Silmä, jotta neliö näyttää vähän hahmolta :)
      ctx.fillStyle = "white";
      ctx.fillRect(player.x + 24, player.y + 8, 10, 10);
      ctx.fillStyle = "black";
      ctx.fillRect(player.x + 29, player.y + 11, 5, 5);
    }

    // ============================================
    //  Pelisilmukka: pyörii n. 60 kertaa sekunnissa
    // ============================================
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop); // pyydetään selainta kutsumaan taas
    }

    gameLoop(); // käynnistetään peli!
  </script>
</body>
</html>
