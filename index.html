<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eeliksen peli</title>
  <style>
    /* Sivun ulkoasu: tumma tausta ja peli keskellä */
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    /* Pelialue (canvas = "piirustuspaperi", jolle peli piirretään) */
    canvas {
      background: #87ceeb; /* taivaansininen */
      border: 4px solid white;
      max-width: 100%;
    }
    p { opacity: 0.7; }
  </style>
</head>
<body>
  <h1>Eeliksen peli</h1>
  <canvas id="peli" width="800" height="300"></canvas>
  <p>Hyppää: välilyönti, nuoli ylös tai klikkaa / napauta</p>

  <script>
    // ============================================
    //  SÄÄDETTÄVÄT ARVOT – kokeile muuttaa näitä!
    // ============================================
    const GRAVITY = 0.6;         // Painovoima: kuinka nopeasti hahmo putoaa alas
    const JUMP_POWER = 12;       // Hypyn voima: kuinka korkealle hahmo hyppää
    const PLAYER_SIZE = 40;      // Hahmon koko pikseleinä
    const PLAYER_COLOR = "#ff4757"; // Hahmon väri
    const GROUND_HEIGHT = 50;    // Maan paksuus ruudun alareunassa
    const GROUND_COLOR = "#2ed573"; // Maan väri

    // --- Esteet ---
    const OBSTACLE_WIDTH = 30;     // Esteen leveys
    const OBSTACLE_MIN_HEIGHT = 30; // Matalin mahdollinen este
    const OBSTACLE_MAX_HEIGHT = 70; // Korkein mahdollinen este
    const OBSTACLE_COLOR = "#2f3542"; // Esteen väri
    const MIN_GAP = 60;  // Lyhin aika (ruutuina) kahden esteen välillä
    const MAX_GAP = 130; // Pisin aika (ruutuina) kahden esteen välillä

    // --- Vauhti ja pisteet ---
    const START_SPEED = 6;        // Vauhti pelin alussa (pikseliä per ruutu)
    const SPEED_INCREASE = 0.003; // Kuinka paljon vauhti kasvaa joka ruudulla
    const MAX_SPEED = 15;         // Vauhti ei kasva tätä suuremmaksi
    const POINTS_PER_PIXEL = 0.1; // Pisteitä jokaisesta juostusta pikselistä

    // ============================================
    //  Pelin valmistelu
    // ============================================
    const canvas = document.getElementById("peli");
    const ctx = canvas.getContext("2d"); // ctx on "kynä", jolla piirretään

    // Maan yläreunan korkeus (y-koordinaatti). Huom: canvasissa y kasvaa ALASPÄIN!
    const groundY = canvas.height - GROUND_HEIGHT;

    // Hahmo on olio, jolla on sijainti (x, y) ja pystynopeus (vy)
    const player = {
      x: 80,
      y: groundY - PLAYER_SIZE, // seisoo maan päällä
      vy: 0,                    // pystysuuntainen nopeus (negatiivinen = ylöspäin)
      onGround: true            // onko hahmo maassa?
    };

    // Lista (taulukko) kaikista ruudulla olevista esteistä
    let obstacles = [];
    // Laskuri: montako ruutua seuraavaan esteeseen
    let nextObstacleIn = 60;
    // Onko peli päättynyt?
    let gameOver = false;
    // Nykyinen vauhti: alkaa START_SPEEDistä ja kasvaa pelin edetessä
    let speed = START_SPEED;
    // Pisteet (desimaalilukuna, näytetään pyöristettynä)
    let score = 0;

    // Apufunktio: arpoo kokonaisluvun väliltä min–max
    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ============================================
    //  Uusi peli: palautetaan kaikki alkutilaan
    // ============================================
    function resetGame() {
      player.y = groundY - PLAYER_SIZE;
      player.vy = 0;
      player.onGround = true;
      obstacles = [];
      nextObstacleIn = 60;
      gameOver = false;
      speed = START_SPEED;
      score = 0;
    }

    // ============================================
    //  Hyppääminen (ja uuden pelin aloitus)
    // ============================================
    function jump() {
      // Jos peli on loppunut, hyppynappi aloittaa uuden pelin
      if (gameOver) {
        resetGame();
        return;
      }
      // Hypätä saa vain maasta, ettei voi lentää ilmassa loputtomasti
      if (player.onGround) {
        player.vy = -JUMP_POWER; // miinus = ylöspäin
        player.onGround = false;
      }
    }

    // Näppäimistö: välilyönti tai nuoli ylös
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault(); // estää sivua vierimästä välilyönnillä
        jump();
      }
    });

    // Hiiri ja kosketusnäyttö
    canvas.addEventListener("pointerdown", jump);

    // ============================================
    //  Esteiden luominen
    // ============================================
    function spawnObstacle() {
      const height = randomBetween(OBSTACLE_MIN_HEIGHT, OBSTACLE_MAX_HEIGHT);
      obstacles.push({
        x: canvas.width,          // syntyy ruudun oikeaan reunaan
        y: groundY - height,      // seisoo maan päällä
        width: OBSTACLE_WIDTH,
        height: height
      });
    }

    // ============================================
    //  Törmäyksen tarkistus
    // ============================================
    // Kaksi suorakulmiota osuvat toisiinsa, jos ne ovat päällekkäin
    // SEKÄ vaakasuunnassa ETTÄ pystysuunnassa.
    function isColliding(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    // ============================================
    //  Päivitys: liikutetaan asioita joka ruudunpäivityksellä
    // ============================================
    function update() {
      // Kun peli on ohi, mikään ei liiku
      if (gameOver) return;

      // --- Hahmo ---
      // Painovoima kasvattaa putoamisnopeutta koko ajan
      player.vy += GRAVITY;
      // Nopeus siirtää hahmoa
      player.y += player.vy;

      // Jos hahmo menisi maan sisään, pysäytetään se maan pinnalle
      if (player.y >= groundY - PLAYER_SIZE) {
        player.y = groundY - PLAYER_SIZE;
        player.vy = 0;
        player.onGround = true;
      }

      // --- Vauhti ja pisteet ---
      // Vauhti kasvaa vähän joka ruudulla, mutta ei yli MAX_SPEEDin.
      // Math.min valitsee kahdesta luvusta pienemmän.
      speed = Math.min(speed + SPEED_INCREASE, MAX_SPEED);
      // Mitä nopeammin juostaan, sitä nopeammin pisteitä kertyy
      score += speed * POINTS_PER_PIXEL;

      // --- Uudet esteet ---
      nextObstacleIn--; // lasketaan alaspäin joka ruudulla
      if (nextObstacleIn <= 0) {
        spawnObstacle();
        nextObstacleIn = randomBetween(MIN_GAP, MAX_GAP); // arvotaan seuraava väli
      }

      // --- Esteiden liikutus ---
      for (const obstacle of obstacles) {
        obstacle.x -= speed; // liikkuu vasemmalle nykyisellä vauhdilla
      }

      // Poistetaan esteet, jotka ovat menneet kokonaan ruudun vasemmalta ulos
      obstacles = obstacles.filter(o => o.x + o.width > 0);

      // --- Törmäys ---
      // Tehdään hahmosta suorakulmio-olio, jotta sitä voi verrata esteisiin.
      // Pienennetään sitä vähän (4 px joka reunalta), jotta "melkein osumat"
      // eivät tunnu epäreiluilta.
      const playerBox = {
        x: player.x + 4,
        y: player.y + 4,
        width: PLAYER_SIZE - 8,
        height: PLAYER_SIZE - 8
      };
      for (const obstacle of obstacles) {
        if (isColliding(playerBox, obstacle)) {
          gameOver = true;
        }
      }
    }

    // ============================================
    //  Piirtäminen
    // ============================================
    function draw() {
      // Tyhjennetään koko ruutu ennen uutta piirtoa
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Maa
      ctx.fillStyle = GROUND_COLOR;
      ctx.fillRect(0, groundY, canvas.width, GROUND_HEIGHT);

      // Esteet
      ctx.fillStyle = OBSTACLE_COLOR;
      for (const obstacle of obstacles) {
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      }

      // Hahmo (toistaiseksi neliö)
      ctx.fillStyle = PLAYER_COLOR;
      ctx.fillRect(player.x, player.y, PLAYER_SIZE, PLAYER_SIZE);

      // Silmä, jotta neliö näyttää vähän hahmolta :)
      ctx.fillStyle = "white";
      ctx.fillRect(player.x + 24, player.y + 8, 10, 10);
      ctx.fillStyle = "black";
      ctx.fillRect(player.x + 29, player.y + 11, 5, 5);

      // Pisteet oikeaan yläkulmaan. Math.floor pyöristää alaspäin kokonaisluvuksi.
      ctx.fillStyle = "#2f3542";
      ctx.textAlign = "right";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText("Pisteet: " + Math.floor(score), canvas.width - 20, 40);

      // Peli ohi -teksti
      if (gameOver) {
        // Puoliläpinäkyvä tumma kerros koko ruudun päälle
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 48px sans-serif";
        ctx.fillText("PELI OHI!", canvas.width / 2, canvas.height / 2 - 30);
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("Sait " + Math.floor(score) + " pistettä",
                     canvas.width / 2, canvas.height / 2 + 10);
        ctx.font = "20px sans-serif";
        ctx.fillText("Paina välilyöntiä tai klikkaa aloittaaksesi uudelleen",
                     canvas.width / 2, canvas.height / 2 + 50);
      }
    }

    // ============================================
    //  Pelisilmukka: pyörii n. 60 kertaa sekunnissa
    // ============================================
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop); // pyydetään selainta kutsumaan taas
    }

    gameLoop(); // käynnistetään peli!
  </script>
</body>
</html>
